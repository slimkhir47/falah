<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ختمة قرآنية بنية نصرة غزة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
      text-align: center;
    }
    .container {
      background-color: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #2c3e50;
    }
    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .khatma-title {
      font-size: 20px;
      font-weight: bold;
      color: #2980b9;
      margin: 30px 0 10px;
      cursor: pointer;
    }
    button {
      background-color: #2ecc71;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      flex: 1 1 45%;
      box-sizing: border-box;
      min-width: 220px;
      transition: 0.3s;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .selected {
      background-color: #f1c40f !important;
      color: #000;
    }
    .message {
      font-size: 18px;
      color: #e74c3c;
      margin-top: 20px;
    }
    #resetButton {
      display: none;
      background-color: #e74c3c;
      margin-top: 20px;
    }
    #selectedCount {
      font-size: 18px;
      margin-bottom: 20px;
      color: #2980b9;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ختمة قرآنية بنية نصرة غزة</h1>
  <p>اختر القصاصة التي تريد قراءتها من أي ختمة متاحة (حسب الترتيب).</p>

  <div id="selectedCount">عدد القصاصات المختارة: 0 / 300</div>
  <div id="buttonContainer"></div>
  <div class="message" id="message"></div>

  <button id="resetButton" onclick="resetData()">إعادة تهيئة جميع الاختيارات</button>
</div>

<script>
  // عدد القصاصات
  const totalChapters = 30;
  const totalKhatmas = 10;
  const totalSelections = totalChapters * totalKhatmas;
  const buttonContainer = document.getElementById("buttonContainer");
  const messageElement = document.getElementById("message");
  const selectedCountElement = document.getElementById("selectedCount");

  let selectedCount = 0;

  // تهيئة الأزرار
  function initializeButtons() {
    buttonContainer.innerHTML = "";
    let allComplete = true;

    for (let k = 1; k <= totalKhatmas; k++) {
      const title = document.createElement("div");
      title.className = "khatma-title";
      title.innerText = `الختمة ${k}`;
      title.onclick = () => selectChapter(k);

      buttonContainer.appendChild(title);
    }
  }

  // اختيار القصاصة
  function selectChapter(khatma) {
    fetch('https://script.google.com/macros/s/AKfycbz4Hwd3KqvNptemlB7mJ8ga9i6MRSS_kXkD2kDObRJOgFPKSCn7WRdPZdu2pbpePx3xBA/exec', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ khatma: khatma })
    })
    .then(response => response.json())
    .then(data => {
      console.log('تم إرسال البيانات بنجاح:', data);
      selectedCount++;  // زيادة العداد
      selectedCountElement.innerText = `عدد القصاصات المختارة: ${selectedCount} / ${totalSelections}`;
    })
    .catch((error) => {
      console.error('حدث خطأ:', error);
    });
  }

  // إعادة تهيئة البيانات
  function resetData() {
    localStorage.clear();
    initializeButtons();
    alert("تم مسح جميع البيانات بنجاح.");
    document.getElementById("resetButton").style.display = "none";
  }

  // تهيئة الأزرار في البداية
  initializeButtons();
</script>

</body>
</html>
